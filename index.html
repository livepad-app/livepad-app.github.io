<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1e1e1e">
<title>LivePad</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%231e1e1e'/><rect x='3' y='3' width='10' height='2' fill='%237f6df2'/><rect x='3' y='7' width='8' height='2' fill='%237f6df2'/><rect x='3' y='11' width='9' height='2' fill='%237f6df2'/></svg>">
<script src="vendor/mqtt.min.js"></script>
<style>
:root{--bg:#1e1e1e;--bg2:#161616;--fg:#dcddde;--mut:#8a8a8a;--ac:#7f6df2;--ac2:#a294fd;--bd:#2b2b2b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
#lock,#wait{display:flex;height:100%;align-items:center;justify-content:center;padding:16px}
.card{background:#252526;border:1px solid var(--bd);border-radius:8px;padding:28px;width:330px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.card h1{margin:0 0 4px;font-size:20px;font-weight:600}
.card p{margin:0 0 16px;color:var(--mut);font-size:13px}
input{width:100%;background:#1a1a1a;border:1px solid var(--bd);color:var(--fg);border-radius:6px;padding:9px 11px;font-size:14px;outline:none}
input:focus{border-color:var(--ac)}
#pw{margin-top:8px}
button{width:100%;margin-top:12px;background:var(--ac);color:#fff;border:0;border-radius:6px;padding:9px;font-size:14px;font-weight:600;cursor:pointer}
button:hover{background:var(--ac2)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
#wait h1{animation:pulse 1.6s infinite}
#err{color:#e06c75;font-size:12.5px;margin-top:10px;min-height:16px}
#app{display:flex;flex-direction:column;height:100%}
#ed{flex:1;width:100%;outline:0;overflow-y:auto;background:var(--bg);color:var(--fg);padding:32px max(20px,calc(50% - 380px));font:15px/1.7 ui-monospace,"Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;caret-color:var(--ac2);white-space:pre-wrap;word-break:break-word}
#ed:empty:before{content:'Start typing or paste an image...';color:#555}
#ed img{max-width:100%;border-radius:6px;margin:6px 0;display:block}
#ed img:not([src]){min-height:60px;min-width:120px;background:#252526;border:1px dashed var(--bd)}
#bar{display:flex;justify-content:space-between;gap:12px;background:var(--bg2);border-top:1px solid var(--bd);color:var(--mut);font-size:12px;padding:4px 12px;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;margin-right:6px}
.dot.on{background:#98c379}
#lk{position:fixed;top:10px;right:12px;background:none;border:0;color:var(--mut);cursor:pointer;font-size:15px;opacity:.55;width:auto;padding:4px}
#lk:hover{opacity:1;color:var(--fg)}
</style>
</head>
<body>
<div id="lock">
  <div class="card">
    <h1>LivePad</h1>
    <input id="name" placeholder="Room" autocomplete="off">
    <input id="pw" type="password" placeholder="Password">
    <button id="go">Open</button>
    <div id="err"></div>
<!-- v12 -->
  </div>
</div>
<div id="wait" hidden>
  <div class="card" style="text-align:center">
    <h1>Waiting...</h1>
    <p>Room <b id="wroom"></b> is open. The notepad unlocks when the other side joins with the same password.</p>
    <p id="wst" style="font-size:12px;color:var(--mut)"></p>
    <p id="whint" style="font-size:12px;color:#e0af68" hidden>Still alone after 20s? Check the note name + password are typed identically on both sides (a wrong password silently opens a different empty room).</p>
  </div>
</div>
<div id="app" hidden>
  <button id="lk" title="lock">&#128274;</button>
  <div id="ed" contenteditable="true" spellcheck="false"></div>
  <div id="bar"><span id="st">connecting...</span><span id="meta">0 words</span></div>
</div>
<script>
const $=i=>document.getElementById(i),TE=new TextEncoder(),TD=new TextDecoder(),ed=$('ed');
let key,topic,pt,sv,peers=new Map(),mqs=[],seq=0,blobs=new Map(),asm=new Map();
let clients=new Set(),gatei,hbi,dogi,down=0;
const myId='lp-'+Math.random().toString(16).slice(2,10);
const seen=new Set();
const ALLB=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
const qb=new URLSearchParams(location.search).get('b');
const BROKERS=qb&&ALLB.some(u=>u.includes(qb))?ALLB.filter(u=>u.includes(qb)):ALLB;
const b64=b=>{let s='';for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(s)};
const CHUNK=200000,MAXB=8*1024*1024;
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const enc=async t=>{const iv=crypto.getRandomValues(new Uint8Array(12));const c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,TE.encode(t)));const b=new Uint8Array(12+c.length);b.set(iv);b.set(c,12);return b64(b)};
const dec=async s=>{const b=ub(s);return TD.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12)))};

async function unlock(){
  const pw=$('pw').value,nm=$('name').value.trim()||'default';
  if(!pw)return;
  if(!crypto.subtle){$('err').textContent='Needs HTTPS (or localhost).';return}
  if(typeof mqtt==='undefined'){$('err').textContent='MQTT lib failed to load.';return}
  $('err').textContent='';
  keepAwake();
  const km=await crypto.subtle.importKey('raw',TE.encode(pw),'PBKDF2',false,['deriveKey']);
  key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:TE.encode('livepad-v2'),iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  const h=new Uint8Array(await crypto.subtle.digest('SHA-256',TE.encode('livepad-room2:'+nm+':'+pw)));
  const hex=[...h].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,20);
  topic='livepad/'+hex;
  $('lock').hidden=true;showWait();
  $('wroom').textContent=hex.slice(0,8);
  try{const d=localStorage.getItem(topic);if(d)ed.innerHTML=parseSafe(await dec(d));await loadBlobs();hydrate()}catch(_){}
  meta();connectAll();
  clearInterval(gatei);gatei=setInterval(gate,10000);
  clearInterval(dogi);down=0;dogi=setInterval(()=>{
    if(!key)return;
    if(mqs.length===0){down+=5;if(down>=120)lockdown('Connection lost: session locked, re-enter password.')}
    else down=0;
  },5000);
  setTimeout(()=>{if(!$('wait').hidden)$('whint').hidden=false},20000);
}

document.addEventListener('visibilitychange',()=>{
  if(document.hidden||!key)return;
  keepAwake();
  for(const c of clients)if(!c.connected)try{c.reconnect()}catch(_){}
  pub({t:'hi'});
});

let ac;
function keepAwake(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    if(ac._lp)return;ac._lp=1;
    const o=ac.createOscillator(),g=ac.createGain();
    g.gain.value=0.0001;o.frequency.value=1;
    o.connect(g);g.connect(ac.destination);o.start();
  }catch(_){}
}

async function lockdown(msg){
  if(!key)return;
  clearTimeout(sv);try{localStorage.setItem(topic,await enc(serialize()))}catch(_){}
  ed.innerHTML='';meta();
  for(const c of clients)try{c.end(true)}catch(_){}
  clients.clear();mqs=[];peers.clear();key=null;
  clearInterval(hbi);clearInterval(gatei);clearInterval(dogi);
  $('app').hidden=true;$('wait').hidden=true;$('whint').hidden=true;$('lock').hidden=false;
  $('pw').value='';$('err').textContent=msg;$('pw').focus();
}

function connectAll(){
  BROKERS.forEach((url,i)=>{
    const host=url.split('/')[2];
    const c=mqtt.connect(url,{clientId:myId+'-'+i,connectTimeout:7000,reconnectPeriod:4000,keepalive:0,
      will:{topic,payload:JSON.stringify({t:'bye',from:myId,id:myId+':w'+i})}});
    clients.add(c);
    c.on('connect',()=>{c._host=host;if(!mqs.includes(c))mqs.push(c);c.subscribe(topic+'/#',{qos:0});
      c.publish(topic,JSON.stringify({t:'hi',from:myId,id:myId+':'+(++seq)}));status()});
    c.on('message',(tp,pl)=>onMsg(pl));
    c.on('close',()=>{const j=mqs.indexOf(c);if(j>-1)mqs.splice(j,1);status()});
    c.on('error',()=>{});
  });
  clearInterval(hbi);hbi=setInterval(()=>pub({t:'hb'}),15000);
}

function pub(m,sub){m.from=myId;m.id=myId+':'+(++seq);
  for(const c of mqs)try{c.publish(topic+(sub||''),JSON.stringify(m),{qos:0,retain:(m.t==='u'&&!m.r)||m.t==='img'})}catch(_){}}

async function onMsg(pl){
  let m;try{m=JSON.parse(pl.toString())}catch(_){return}
  if(!m||m.from===myId)return;
  if(m.id){if(seen.has(m.id))return;seen.add(m.id);
    if(seen.size>800)seen.delete(seen.values().next().value)}
  if(m.t==='bye'){peers.delete(m.from);gate();return}
  if(m.t==='hi'||m.t==='hb'){peers.set(m.from,Date.now());gate();
    if(m.t==='hi'){pub({t:'hb'});if(ed.textContent.trim()||ed.querySelector('img'))pub({t:'u',d:await enc(serialize()),r:1})}return}
  if(m.t==='img'){const k=m.k||1,n=m.n||0;
    let a=asm.get(m.b);if(!a){a={k,p:[]};asm.set(m.b,a)}
    a.k=k;a.p[n]=m.d;
    if(a.p.filter(Boolean).length===a.k){asm.delete(m.b);
      try{blobs.set(m.b,await dec(a.p.join('')));hydrate();cacheBlob(m.b)}catch(_){}}
    return}
  if(m.t==='imgreq'){const d=blobs.get(m.b);if(d)pubBlob(m.b,d);return}
  if(m.t==='u'){let t;try{t=await dec(m.d)}catch(_){return}applyRemote(t);save()}
}

function livePeers(){const now=Date.now();for(const[id,ts]of peers)if(now-ts>120000)peers.delete(id);return peers.size}
function gate(){const n=livePeers();status();if(n>0)showApp();else showWait()}
function showWait(){$('wait').hidden=false;$('app').hidden=true}
function showApp(){$('wait').hidden=true;$('app').hidden=false;ed.focus()}

function sanitize(root){
  for(const ch of [...root.childNodes]){
    if(ch.nodeType===3)continue;
    if(ch.nodeType!==1){ch.remove();continue}
    const t=ch.tagName;
    if(t==='IMG'){
      const b=ch.getAttribute('data-b')||'',nu=document.createElement('img');
      if(/^[a-z0-9]{6,20}$/i.test(b))nu.setAttribute('data-b',b);
      ch.replaceWith(nu);continue;
    }
    if(t==='DIV'||t==='P'||t==='BR'){
      for(const a of [...ch.attributes])ch.removeAttribute(a.name);
      sanitize(ch);continue;
    }
    ch.replaceWith(document.createTextNode(ch.textContent));
  }
}

function parseSafe(t){
  const d=new DOMParser().parseFromString(t,'text/html');
  sanitize(d.body);
  return d.body.innerHTML;
}

function serialize(){
  const c=ed.cloneNode(true);
  c.querySelectorAll('img').forEach(im=>{im.removeAttribute('src');im.removeAttribute('alt')});
  return c.innerHTML;
}

function hydrate(){
  ed.querySelectorAll('img[data-b]').forEach(el=>{
    const id=el.getAttribute('data-b'),d=blobs.get(id);
    if(d){if(el.src!==d)el.src=d}
    else{el.removeAttribute('src');el.alt='syncing image...';pub({t:'imgreq',b:id})}
  });
}

function caretPos(){const s=getSelection();if(!s.rangeCount)return 0;
  const r=s.getRangeAt(0),pre=r.cloneRange();
  pre.selectNodeContents(ed);pre.setEnd(r.startContainer,r.startOffset);
  return pre.toString().length}
function setCaret(pos){const w=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT);let n,l=0;
  while(n=w.nextNode()){if(l+n.length>=pos){const s=getSelection(),r=document.createRange();
    r.setStart(n,pos-l);r.collapse(true);s.removeAllRanges();s.addRange(r);return}l+=n.length}}

function applyRemote(t){
  if(t===serialize())return;
  const focused=document.activeElement===ed,pos=focused?caretPos():0,sc=ed.scrollTop;
  ed.innerHTML=parseSafe(t);hydrate();
  if(focused)try{setCaret(Math.min(pos,ed.textContent.length))}catch(_){}
  ed.scrollTop=sc;meta();
}

function insertAtCaret(node){
  const s=getSelection();
  if(s.rangeCount&&ed.contains(s.getRangeAt(0).startContainer)){
    const r=s.getRangeAt(0);r.deleteContents();r.insertNode(node);
    r.setStartAfter(node);r.collapse(true);s.removeAllRanges();s.addRange(r);
  }else ed.appendChild(node);
}

async function pubBlob(id,d){
  const ct=await enc(d),k=Math.ceil(ct.length/CHUNK);
  for(let n=0;n<k;n++)pub({t:'img',b:id,n,k,d:ct.slice(n*CHUNK,(n+1)*CHUNK)},'/i/'+id+'/'+n);
}

async function cacheBlob(id){try{localStorage.setItem(topic+'/b/'+id,await enc(blobs.get(id)))}catch(_){}}
async function loadBlobs(){try{for(let i=0;i<localStorage.length;i++){const k2=localStorage.key(i);
  if(k2&&k2.startsWith(topic+'/b/'))blobs.set(k2.slice((topic+'/b/').length),await dec(localStorage.getItem(k2)))}}catch(_){}}

function addImage(f){
  const finish=async d=>{
    const id=Math.random().toString(36).slice(2,14);
    blobs.set(id,d);cacheBlob(id);
    const el=document.createElement('img');el.setAttribute('data-b',id);el.src=d;
    insertAtCaret(el);
    ed.dispatchEvent(new Event('input'));
    await pubBlob(id,d);
  };
  const rd=new FileReader();
  rd.onload=()=>{
    if(rd.result.length<=MAXB*1.37)return finish(rd.result);
    const im=new Image();im.onload=async()=>{
      let max=3000,q=0.9,d='';
      const cv=document.createElement('canvas'),cx=cv.getContext('2d');
      for(;;){
        const k=Math.min(1,max/Math.max(im.width,im.height));
        cv.width=Math.max(1,Math.round(im.width*k));cv.height=Math.max(1,Math.round(im.height*k));
        cx.clearRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);
        d=cv.toDataURL('image/webp',q);
        if(!d.startsWith('data:image/webp'))d=cv.toDataURL('image/jpeg',q);
        if(d.length<=MAXB*1.37||max<=400)break;
        max=Math.round(max*0.7);q=Math.max(0.5,q-0.1);
      }
      finish(d);
    };im.src=rd.result};
  rd.readAsDataURL(f);
}

ed.addEventListener('paste',e=>{
  e.preventDefault();
  const cd=e.clipboardData;if(!cd)return;
  const it=[...cd.items].find(i=>i.type.startsWith('image/'));
  if(it){const f=it.getAsFile();if(f)addImage(f);return}
  const t=cd.getData('text/plain');
  if(t){insertAtCaret(document.createTextNode(t));ed.dispatchEvent(new Event('input'))}
});
ed.addEventListener('input',()=>{meta();save();clearTimeout(pt);pt=setTimeout(push,120)});
ed.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();insertAtCaret(document.createTextNode('  '));ed.dispatchEvent(new Event('input'))}});
async function push(){pub({t:'u',d:await enc(serialize())})}
function save(){clearTimeout(sv);sv=setTimeout(async()=>{try{localStorage.setItem(topic,await enc(serialize()))}catch(_){}},250)}
function status(m){const n=livePeers(),up=mqs.length>0;
  let s;
  if(m)s=m;
  else if(!up)s='Connecting...';
  else if(n)s=`Connected · ${n} peer${n===1?'':'s'}`;
  else s='Connected · waiting for peer';
  $('st').innerHTML=`<span class="dot ${up&&n?'on':''}"></span>${s}`;
  $('wst').textContent=s}
function meta(){const v=(ed.innerText||'').trim(),w=v?v.split(/\s+/).length:0;$('meta').textContent=`${w} word${w===1?'':'s'}`}
$('go').onclick=unlock;
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
$('lk').onclick=()=>lockdown('Locked.');
</script>
</body>
</html>
